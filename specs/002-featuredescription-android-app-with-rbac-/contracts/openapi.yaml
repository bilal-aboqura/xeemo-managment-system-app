openapi: 3.0.3
info:
  title: XeemoApp Sales API
  version: 1.0.0
paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
        '401':
          description: Unauthorized
  /products:
    get:
      summary: List products
      responses:
        '200':
          description: List of products
    post:
      summary: Add product (Manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
    put:
      summary: Edit product (Manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete product (Manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: string
      responses:
        '204':
          description: Product deleted
  /tickets:
    get:
      summary: List all tickets (Manager only)
      responses:
        '200':
          description: List of tickets
    post:
      summary: Create sales ticket (Worker only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '201':
          description: Ticket created
  /tickets/export:
    get:
      summary: Export tickets as Excel (Manager only)
      responses:
        '200':
          description: Excel file
components:
  schemas:
    ProductInput:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        details:
          type: string
    TicketInput:
      type: object
      properties:
        client_name:
          type: string
        client_phone:
          type: string
        worker_notes:
          type: string
        client_notes:
          type: string
        sale_amount:
          type: number
        products:
          type: array
          items:
            type: string
        latitude:
          type: number
        longitude:
          type: number
